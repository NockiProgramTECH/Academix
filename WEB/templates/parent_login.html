{% extends 'base.html' %}

{% block title %}Connexion Parent - Academix{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Connexion Parent</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'parent_register' %}" class="btn btn-link">Pas de compte ? S'inscrire</a>
                        <hr>
                        <a href="/" class="text-muted text-decoration-none">← Retour à l'accueil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
